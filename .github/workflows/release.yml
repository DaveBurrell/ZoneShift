name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: |
          dotnet restore ZoneShift.sln
          dotnet build ZoneShift.sln -c Release --no-restore
          dotnet test --solution ZoneShift.sln -c Release --no-build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC
        id: iscc
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { throw "ISCC.exe not found after choco install" }
          echo "path=$found" >> $env:GITHUB_OUTPUT

      - name: Publish and pack installers
        shell: pwsh
        # Passed through the environment, never interpolated into the script, so a tag name
        # cannot inject PowerShell.
        env:
          TAG_NAME: ${{ github.ref_name }}
          ISCC_PATH: ${{ steps.iscc.outputs.path }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:TAG_NAME' is not vMAJOR.MINOR.PATCH" }
          $version = $Matches[1]
          $iscc = $env:ISCC_PATH
          $root = $PWD

          function Publish($rid) {
            $out = Join-Path $root "publish\$rid"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            dotnet publish TimezoneConverter.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none `
              -p:Version=$version `
              -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish $rid failed" }
          }

          Publish "win-x64"
          Publish "win-arm64"

          New-Item -ItemType Directory -Force -Path (Join-Path $root "dist") | Out-Null

          & $iscc "/DMyAppVersion=$version" "/DAppArch=x64" "/DPublishDir=..\publish\win-x64" "installer\ZoneShift.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC x64 failed" }
          & $iscc "/DMyAppVersion=$version" "/DAppArch=arm64" "/DPublishDir=..\publish\win-arm64" "installer\ZoneShift.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC arm64 failed" }

          Get-ChildItem dist -Filter "ZoneShift-Setup-*.exe" | ForEach-Object { $_.FullName }

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/ZoneShift-Setup-*-x64.exe
            dist/ZoneShift-Setup-*-arm64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
